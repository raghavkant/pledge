# Weekly: checks links to other sites (Home Affairs, Apple, licences). Warnings only, because some
# sites block automated checkers; a broken internal link still fails.
name: External links

on:
  schedule:
    - cron: '0 22 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
      - run: node scripts/check-links.mjs --external
